name: CI

# Build the plugin + run the wrapper test suite. Doubles as the regression
# gate for runtime bumps: the headless contract tests fail loudly at a named
# wrapper↔runtime contract point if upstream drifts. Render checks exercise
# Metal on macOS, D3D11/D3D12 through WARP, and OpenGL/Vulkan through Mesa.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.11.1"

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 is the primary leg: Metal backend + full suite
          # including the offscreen render smoke.
          - os: macos-latest
            qt-arch: clang_64
            qt-host: mac
            cmake-args: "-G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64"
          - os: macos-latest
            qt-arch: clang_64
            qt-host: mac
            cmake-args: "-G Ninja -DCMAKE_OSX_ARCHITECTURES=x86_64"
          # Windows builds all adapters and renders through D3D11/D3D12 WARP.
          # Mesa on Linux exercises OpenGL and Vulkan with software drivers.
          - os: windows-2022
            qt-arch: win64_msvc2022_64
            qt-host: windows
            cmake-args: '-G "Visual Studio 17 2022" -A x64'
          - os: ubuntu-24.04
            qt-arch: linux_gcc_64
            qt-host: linux
            cmake-args: "-G Ninja"

    steps:
      - name: Checkout (with rive-runtime submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          modules: qtshadertools
          cache: true
          # Qt 6.11+ Windows uses a flattened per-arch repo layout that
          # aqtinstall v3.3.0 (the version bundled by the action) can't parse,
          # so the Install Qt step fails on Windows with "Failed to locate XML
          # data for Qt version 6.11.1" (macOS is unaffected). Pin aqt to the
          # master SHA carrying the fix until aqt v3.4+ ships on PyPI — same
          # workaround as hypershot's build.yml. Drop this once aqt releases.
          aqtsource: "git+https://github.com/miurahr/aqtinstall.git@75ea7944aeac985e226df0a882cd5b3470e51a97"

      - name: Install Rive macOS build prerequisites
        # rive-runtime compiles its Metal renderer shaders at build time.
        # Newer Xcode ships the Metal compiler as a separately-downloaded
        # component; attempt the download only when the option exists, and
        # never fail the build over it. glslang/spirv-tools are insurance for
        # a future Vulkan-enabled Qt (the backend self-disables on stock aqt
        # Qt where QT_FEATURE_vulkan=OFF).
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if xcodebuild -downloadComponent MetalToolchain 2>/dev/null; then
            echo "Metal toolchain component downloaded."
          else
            echo "Metal toolchain bundled with this Xcode; continuing."
          fi
          brew install glslang spirv-tools

      - name: Install Linux build and rendering prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm ninja-build libgl1-mesa-dev \
            libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools \
            xvfb xauth libxkbcommon-x11-0 libxcb-cursor0

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DRIVE_QT_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            ${{ matrix.cmake-args }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Test
        shell: bash
        env:
          RIVE_QT_SAMPLE_SNAPSHOT_DIR: ${{ github.workspace }}/build/sample-frames
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBGL_ALWAYS_SOFTWARE=1
            export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
            xvfb-run -a ctest --test-dir build --build-config Release --output-on-failure
          elif [ "$RUNNER_OS" = "Windows" ]; then
            export QSG_RHI_PREFER_SOFTWARE_RENDERER=1
            export QSG_RHI_DEBUG_LAYER=1
            # The hosted Windows runner provides WARP; GL/Vulkan are covered on Linux.
            ctest --test-dir build --build-config Release --output-on-failure \
              -E '^UpgradeSamples.render.(opengl|vulkan)\.'
          else
            MTL_DEBUG_LAYER=1 ctest --test-dir build --build-config Release --output-on-failure
          fi

      - name: Upload rendered sample frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-frames-${{ matrix.os }}-${{ strategy.job-index }}
          path: build/sample-frames/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-${{ strategy.job-index }}
          path: build/Testing/
          retention-days: 7

  # Single aggregated status for branch protection: the matrix legs are
  # individual contexts, so require this one job instead.
  ci-gate:
    name: ci-gate
    needs: [build-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          result="${{ needs.build-test.result }}"
          echo "build-test result: $result"
          if [ "$result" = "success" ]; then
            echo "ci-gate: pass"; exit 0
          fi
          echo "ci-gate: fail"; exit 1
